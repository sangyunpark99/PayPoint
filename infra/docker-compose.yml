services:
  spring:
    container_name: spring
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: >
        -Xms512m -Xmx512m
        -XX:MaxDirectMemorySize=128m
        -XX:+UseG1GC
      TZ : "Asia/Seoul"
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
    cpus : 1
    mem_limit: 1g
    mem_reservation: 1g
    cpuset: "0"

  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    restart: always
    environment:
      MYSQL_DATABASE: pointpay
      MYSQL_ROOT_PASSWORD: root
      TZ : "Asia/Seoul"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=150
      - --innodb_buffer_pool_size=512M
      - --innodb_log_file_size=128M
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-do-db=pointpay
    volumes:
      - ./db/mysql/master:/var/lib/mysql
      - ./db/mysql/master.cnf:/etc/mysql/conf.d/master.cnf
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: 2
    cpuset: "1-2"
    mem_limit: 1g
    mem_reservation: 1g

  mysql-slave:
    image: mysql:8.0
    container_name: mysql-slave
    restart: always
    depends_on:
      - mysql-master
    environment:
      MYSQL_DATABASE: pointpay
      MYSQL_ROOT_PASSWORD: root
      TZ: "Asia/Seoul"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=150
      - --innodb_buffer_pool_size=512M
      - --innodb_log_file_size=128M
      - --server-id=2
      - --relay-log=mysql-relay-bin
      - --log-bin=mysql-bin
      - --read-only=1

    volumes:
      - ./db/mysql/slave:/var/lib/mysql
      - ./db/mysql/slave.cnf:/etc/mysql/conf.d/slave.cnf
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: 2
    cpuset: "3-4"
    mem_limit: 1g
    mem_reservation: 1g

  mysqld-exporter:
    container_name: mysql-exporter
    image: prom/mysqld-exporter
    environment:
      TZ : "Asia/Seoul"
    ports:
      - "9104:9104"
    command:
      - "--mysqld.username=exporter:exporter_pass"
      - "--mysqld.address=mysql:3306"
    restart: always

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    environment:
      TZ: "Asia/Seoul"
    ports:
      - "9090:9090"
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - mysqld-exporter

  grafana:
    container_name: grafana
    image: grafana/grafana
    environment:
      TZ: "Asia/Seoul"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:latest
    container_name: k6-load-test
    profiles: ["loadtest"]
    environment:
      - K6_WEB_DASHBOARD=true
      - K6_WEB_DASHBOARD_EXPORT=/scripts/result/report.html
      - TZ=Asia/Seoul"
    ports:
      - "5665:5665"
    volumes:
      - ./k6:/scripts
    command: run --out web-dashboard /scripts/main.js

volumes:
  grafana-data:
  prometheus-data:
  mysql_data: