spring:
  datasource:
    master:
      url: jdbc:mysql://mysql-master:3306/pointpay
      username: root
      password: root
    slave:
      url: jdbc:mysql://mysql-slave:3306/pointpay
      username: root
      password: root

    hikari:
      minimum-idle: 5
      maximum-pool-size: 30
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    url: jdbc:mysql://mysql-master:3306/pointpay
    user: root
    password:
    enabled: true
    locations: classpath:db/migration

server:
  tomcat:
    threads:
      max: 250
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    enable:
      tomcat: true

logging:
  level:
    org.springframework.retry: DEBUG
    root: info
