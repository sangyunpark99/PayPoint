spring:
  datasource:
    url: jdbc:mysql://mysql:3306/pointpay
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 25
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: info